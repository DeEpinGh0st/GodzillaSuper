encryptionMethod=public static byte[] pdfW(System.String s){return System.Text.Encoding.ASCII.GetBytes(s);}public static byte[] pdfEncode(byte[] data){System.IO.MemoryStream zms=new System.IO.MemoryStream();System.IO.Compression.DeflateStream ds=new System.IO.Compression.DeflateStream(zms,System.IO.Compression.CompressionMode.Compress,true);ds.Write(data,0,data.Length);ds.Close();byte[] z=zms.ToArray();System.Random rnd=new System.Random();int w=64+rnd.Next(64);int h=System.Math.Max(1,(data.Length+w-1)/w);System.IO.MemoryStream out=new System.IO.MemoryStream();out.Write(pdfW("%PDF-1.4\\n"),0,8);out.Write(pdfW("%"+rnd.Next().ToString("x")+"\\n"),0,9);long off1=out.Position;out.Write(pdfW("1 0 obj\\n"),0,7);string h1="<< /Type /XObject /Subtype /Image /Width "+w+" /Height "+h+" /ColorSpace /DeviceGray /BitsPerComponent 8 /Filter /FlateDecode /Length "+z.Length+" >>\\n";out.Write(pdfW(h1),0,h1.Length);string h2="stream\\n";out.Write(pdfW(h2),0,h2.Length);out.Write(z,0,z.Length);string h3="\\nendstream\\nendobj\\n";out.Write(pdfW(h3),0,h3.Length);long off2=out.Position;out.Write(pdfW("2 0 obj\\n"),0,7);string h4="<< /Type /Page /Parent 3 0 R /MediaBox [0 0 "+w+" "+h+"] /Resources << /XObject << /Im0 1 0 R >> >> /Contents 4 0 R >>\\nendobj\\n";out.Write(pdfW(h4),0,h4.Length);long off3=out.Position;string h5="3 0 obj\\n<< /Type /Pages /Kids [2 0 R] /Count 1 >>\\nendobj\\n";out.Write(pdfW(h5),0,h5.Length);long off4=out.Position;string h6="4 0 obj\\n<< /Length 0 >>\\nstream\\n\\nendstream\\nendobj\\n";out.Write(pdfW(h6),0,h6.Length);long off5=out.Position;string h7="5 0 obj\\n<< /Type /Catalog /Pages 3 0 R >>\\nendobj\\n";out.Write(pdfW(h7),0,h7.Length);long xrefOff=out.Position;string h8="xref\\n0 6\\n0000000000 65535 f \\n";out.Write(pdfW(h8),0,h8.Length);foreach(long o in new long[]{off1,off2,off3,off4,off5}){string hx=o.ToString("D10")+" 00000 n \\n";out.Write(pdfW(hx),0,hx.Length);}string h9="trailer\\n<< /Size 6 /Root 5 0 R >>\\nstartxref\\n"+xrefOff+"\\n%%EOF";out.Wr