decryptionMethod=public static byte[] pdfDecode(byte[] pdf){System.String s=System.Text.Encoding.ASCII.GetString(pdf);int p=s.IndexOf("stream");while(p>=0){int start=p+6;if(start<s.Length&&s[start]==13){start++;}if(start<s.Length&&s[start]==10){start++;}int end=s.IndexOf("endstream",start);if(end<0){return null;}byte[] z=new byte[end-start];System.Buffer.BlockCopy(pdf,start,z,0,z.Length);if(z.Length>2){System.IO.MemoryStream ms=new System.IO.MemoryStream(z,2,z.Length-6);System.IO.Compression.DeflateStream d2=new System.IO.Compression.DeflateStream(ms,System.IO.Compression.CompressionMode.Decompress);System.IO.MemoryStream outMs=new System.IO.MemoryStream();d2.CopyTo(outMs);d2.Close();return outMs.ToArray();}p=s.IndexOf("stream",end);}return null;}
