encryptionMethod=function pdfEncode($data){$z=gzcompress($data);$w=64+mt_rand(0,63);$h=max(1,intval(ceil(strlen($data)/$w)));$out="%PDF-1.4\\n";$out.="%".dechex(mt_rand())."\\n";$out.="1 0 obj\\n";$out.="<< /Type /XObject /Subtype /Image /Width ".$w." /Height ".$h." /ColorSpace /DeviceGray /BitsPerComponent 8 /Filter /FlateDecode /Length ".strlen($z)." >>\\n";$out.="stream\\n";$out.=$z;$out.="\\nendstream\\nendobj\\n";$off1=strlen($out);$out.="2 0 obj\\n";$out.="<< /Type /Page /Parent 3 0 R /MediaBox [0 0 ".$w." ".$h."] /Resources << /XObject << /Im0 1 0 R >> >> /Contents 4 0 R >>\\n";$out.="endobj\\n";$off2=strlen($out);$out.="3 0 obj\\n<< /Type /Pages /Kids [2 0 R] /Count 1 >>\\nendobj\\n";$off3=strlen($out);$out.="4 0 obj\\n<< /Length 0 >>\\nstream\\n\\nendstream\\nendobj\\n";$off4=strlen($out);$out.="5 0 obj\\n<< /Type /Catalog /Pages 3 0 R >>\\nendobj\\n";$off5=strlen($out);$xrefOff=strlen($out);$out.="xref\\n0 6\\n0000000000 65535 f \\n";foreach(array($off1,$off2,$off3,$off4,$off5) as $o){$out.=sprintf("%010d 00000 n \\n",$o);}$out.="trailer\\n<< /Size 6 /Root 5 0 R >>\\nstartxref\\n".$xrefOff."\\n%%EOF";return $out;}
decryptionMethod=function pdfDecode($pdf){$p=strpos($pdf,"stream");while($p!==false){$start=$p+6;if(substr($pdf,$start,1)=="\\r"){$start++;}if(substr($pdf,$start,1)=="\\n"){$start++;}$end=strpos($pdf,"endstream",$start);if($end===false){return null;}$z=substr($pdf,$start,$end-$start);if(strlen($z)>2){return gzuncompress($z);}$p=strpos($pdf,"stream",$end);}return null;}
variable=
encryptionCallMethod=$responseData=pdfEncode($responseData);
decryptionCallMethod=$requestData=pdfDecode($requestData);
