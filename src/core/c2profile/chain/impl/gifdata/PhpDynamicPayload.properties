encryptionMethod=function gifEncode($data){$len=max(1,strlen($data));$w=max(1,intval(sqrt($len))+mt_rand(0,2));$h=max(1,intval(ceil($len/$w)));$im=imagecreate($w,$h);for($i=0;$i<imagecolorstotal($im);$i++){imagecolordeallocate($im,$i);}$colors=array();for($i=0;$i<256;$i++){$colors[$i]=imagecolorallocate($im,$i,$i,$i);}$p=0;for($y=0;$y<$h;$y++){for($x=0;$x<$w;$x++){imagesetpixel($im,$x,$y,$colors[$p<strlen($data)?ord($data[$p]):0]);$p++;}}ob_start();imagegif($im);$gif=ob_get_contents();ob_end_clean();imagedestroy($im);return $gif;}
decryptionMethod=function gifDecode($gif){$im=imagecreatefromgif($gif);if(!$im){return null;}$w=imagesx($im);$h=imagesy($im);$raw="";for($y=0;$y<$h;$y++){for($x=0;$x<$w;$x++){$idx=imagecolorat($im,$x,$y);$c=imagecolorsforindex($im,$idx);$raw.=chr($c["red"]);}}imagedestroy($im);return rtrim($raw,"\\x00");}
variable=
encryptionCallMethod=$responseData=gifEncode($responseData);
decryptionCallMethod=$requestData=gifDecode($requestData);
