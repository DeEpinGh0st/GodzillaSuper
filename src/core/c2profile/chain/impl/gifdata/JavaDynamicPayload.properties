encryptionMethod=public static byte[] gifEncode(byte[] data){try{int len=Math.max(1,data.length);java.util.Random rnd=new java.util.Random();int w=Math.max(1,(int)Math.sqrt(len)+rnd.nextInt(3));int h=Math.max(1,(len+w-1)/w);byte[] ramp=new byte[256];for(int i=0;i<256;i++){ramp[i]=(byte)i;}java.awt.image.IndexColorModel icm=new java.awt.image.IndexColorModel(8,256,ramp,ramp,ramp);java.awt.image.BufferedImage img=new java.awt.image.BufferedImage(w,h,java.awt.image.BufferedImage.TYPE_BYTE_INDEXED,icm);byte[] raster=((java.awt.image.DataBufferByte)img.getRaster().getDataBuffer()).getData();System.arraycopy(data,0,raster,0,data.length);javax.imageio.ImageWriter wr=javax.imageio.ImageIO.getImageWritersByFormatName("gif").next();javax.imageio.ImageWriteParam p=wr.getDefaultWriteParam();javax.imageio.metadata.IIOMetadata meta=wr.getDefaultImageMetadata(new javax.imageio.ImageTypeSpecifier(img),p);org.w3c.dom.Node root=meta.getAsTree(meta.getNativeMetadataFormatName());for(int i=0;i<root.getChildNodes().getLength();i++){org.w3c.dom.Node n=root.getChildNodes().item(i);if("ImageDescriptor".equals(n.getNodeName())){((org.w3c.dom.Element)n).setAttribute("interlaceFlag","FALSE");}}meta.setFromTree(meta.getNativeMetadataFormatName(),root);java.io.ByteArrayOutputStream bos=new java.io.ByteArrayOutputStream();javax.imageio.stream.ImageOutputStream ios=javax.imageio.ImageIO.createImageOutputStream(bos);wr.setOutput(ios);wr.write(null,new javax.imageio.IIOImage(img,null,meta),p);ios.close();wr.dispose();return bos.toByteArray();}catch(Exception e){return null;}}
decryptionMethod=public static byte[] gifDecode(byte[] gif){try{java.awt.image.BufferedImage img=javax.imageio.ImageIO.read(new java.io.ByteArrayInputStream(gif));if(img==null){return null;}int w=img.getWidth();int h=img.getHeight();java.awt.image.IndexColorModel cml=(img.getColorModel() instanceof java.awt.image.IndexColorModel)?(java.awt.image.IndexColorModel)img.getColorModel():null;byte[] raw=new byte[w*h];int p=0;for(int y=0;y<h;y++){for(int x=0;x<w;x++){int idx=img.getRaster().getSample(x,y,0);raw[p++]=(byte)(cml!=null?cml.getRed(idx):idx);}}int end=raw.length;while(end>0&&raw[end-1]==0){end--;}byte[] out=new byte[end];System.arraycopy(raw,0,out,0,end);return out;}catch(Exception e){return null;}}
