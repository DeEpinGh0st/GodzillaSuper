encryptionMethod=public static byte[] gifEncode(byte[] data){int len=System.Math.Max(1,data.Length);System.Random rnd=new System.Random();int w=System.Math.Max(1,(int)System.Math.Sqrt(len)+rnd.Next(3));int h=System.Math.Max(1,(len+w-1)/w);System.Drawing.Bitmap bmp=new System.Drawing.Bitmap(w,h,System.Drawing.Imaging.PixelFormat.Format8bppIndexed);System.Drawing.Imaging.ColorPalette pal=bmp.Palette;for(int i=0;i<256;i++){pal.Entries[i]=System.Drawing.Color.FromArgb(i,i,i);}bmp.Palette=pal;System.Drawing.Imaging.BitmapData bd=bmp.LockBits(new System.Drawing.Rectangle(0,0,w,h),System.Drawing.Imaging.ImageLockMode.WriteOnly,System.Drawing.Imaging.PixelFormat.Format8bppIndexed);int s=bd.Stride;byte[] row=new byte[s];int p=0;for(int y=0;y<h;y++){for(int x=0;x<w;x++){row[x]=(p<data.Length)?data[p]:(byte)0;p++;}System.Runtime.InteropServices.Marshal.Copy(row,0,System.IntPtr.Add(bd.Scan0,y*s),s);}bmp.UnlockBits(bd);System.IO.MemoryStream ms=new System.IO.MemoryStream();bmp.Save(ms,System.Drawing.Imaging.ImageFormat.Gif);bmp.Dispose();return ms.ToArray();}
decryptionMethod=public static byte[] gifDecode(byte[] gif){System.IO.MemoryStream ms=new System.IO.MemoryStream(gif);System.Drawing.Bitmap bmp=new System.Drawing.Bitmap(ms);int w=bmp.Width;int h=bmp.Height;System.Drawing.Imaging.BitmapData bd=bmp.LockBits(new System.Drawing.Rectangle(0,0,w,h),System.Drawing.Imaging.ImageLockMode.ReadOnly,System.Drawing.Imaging.PixelFormat.Format8bppIndexed);int s=bd.Stride;byte[] row=new byte[s];byte[] raw=new byte[w*h];int p=0;for(int y=0;y<h;y++){System.Runtime.InteropServices.Marshal.Copy(System.IntPtr.Add(bd.Scan0,y*s),row,0,s);System.Array.Copy(row,0,raw,p,w);p+=w;}bmp.UnlockBits(bd);bmp.Dispose();int end=raw.Length;while(end>0&&raw[end-1]==0){end--;}byte[] out=new byte[end];System.Array.Copy(raw,out,end);return out;}
